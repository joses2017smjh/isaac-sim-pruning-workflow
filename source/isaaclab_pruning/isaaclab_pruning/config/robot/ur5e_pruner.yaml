name: ur5e_pruner
description: 6R UR5e + 1P slider. Amiga base is fixed during a cut.
prefixes:
  slider: linear_slider__
  arm: ur5e__
  eef: mock_pruner__
eef_body: mock_pruner__tool0
slider_held_fixed: true
action_dim: 7
ik:
  method: dls
  lambda_val: 1.0e-4
  command_type: pose
  use_relative_mode: true
joints:
  slider:
    - name: linear_slider__joint1
      type: prismatic
      lower_m: 0.0
      upper_m: 0.80
      stiffness: 1.0e5
      damping: 1.0e3
  arm:
    - name: ur5e__shoulder_pan_joint
      type: revolute
      lower_rad: -6.28318530718
      upper_rad: 6.28318530718
      effort_limit: 150.0
    - name: ur5e__shoulder_lift_joint
      type: revolute
      lower_rad: -6.28318530718
      upper_rad: 6.28318530718
      effort_limit: 150.0
    - name: ur5e__elbow_joint
      type: revolute
      lower_rad: -3.14159265359
      upper_rad: 3.14159265359
      effort_limit: 150.0
    - name: ur5e__wrist_1_joint
      type: revolute
      lower_rad: -6.28318530718
      upper_rad: 6.28318530718
      effort_limit: 28.0
    - name: ur5e__wrist_2_joint
      type: revolute
      lower_rad: -6.28318530718
      upper_rad: 6.28318530718
      effort_limit: 28.0
    - name: ur5e__wrist_3_joint
      type: revolute
      lower_rad: -6.28318530718
      upper_rad: 6.28318530718
      effort_limit: 28.0
actuators:
  arm:
    joint_names_expr: ["ur5e__.*"]
    stiffness: 800.0
    damping: 40.0
  slider:
    joint_names_expr: ["linear_slider__joint1"]
    stiffness: 1.0e5
    damping: 1.0e3
cutter:
  mouth_half_extents_m: [0.025, 0.018, 0.012]
  failure_half_extents_m: [0.040, 0.035, 0.025]
  failure_offset_m: [0.0, 0.0, -0.035]
  source: nominal_until_stl_fit
  perpendicularity_tolerance_deg: 15.0
  report_as_sweep: true
