name: ur5e_pruner
description: >
  6R UR5e + mock-pruner generated from pinned source and a selected UR5e
  calibration, then validated on Isaac Sim 6.0. v1 holds the real-machine
  slider fixed before the approach and does not spawn it.
usd:
  relative_path: artifacts/usd/ur5e_mock_pruner_bdsdfede4c0_ur18e6f603_calib_3941312424972580002_urdf6b02ce9330be/ur5e_mock_pruner_bdsdfede4c0_ur18e6f603_calib_3941312424972580002_urdf6b02ce9330be_abs/ur5e_mock_pruner_bdsdfede4c0_ur18e6f603_calib_3941312424972580002_urdf6b02ce9330be_abs.usda
  asset_id: ur5e_mock_pruner_bdsdfede4c0_ur18e6f603_calib_3941312424972580002_urdf6b02ce9330be
  import_evidence: docs/evidence/urdf_import_21136450.json
  import_job: "21136450"
  status: validated_content_addressed
  hardware_transform_match: true
  reimport_required: false
  contains_slider: false
  prim_path: /pruning_robot
  physics_eef_body: mock_pruner__base
  control_tool_frame: mock_pruner__tool0
prefixes:
  slider: linear_slider__
  arm: ur5e__
  eef: mock_pruner__
# Differential IK must query a rigid physics body. mock_pruner__tool0 is a
# fixed Xacro frame and may be merged away by URDF import, so commands and
# task geometry use the reviewed fixed transform below.
physics_eef_body: mock_pruner__base
control_tool_frame: mock_pruner__tool0
control_tool_translation_in_physics_body_m: [0.0, 0.0, 0.1601525]
control_tool_quaternion_wxyz_in_physics_body: [1.0, 0.0, 0.0, 0.0]
slider_held_fixed: true
# EE pose command (xyz + wxyz), not 6R+slider. The slider is documented below
# for the real machine and is not in ArticulationCfg.joint_names_expr.
action_dim: 7
ik:
  method: dls
  lambda_val: 1.0e-4
  command_type: pose
  # Absolute EE pose (xyz + wxyz) is 7-D. Relative mode is 6-D (pos + axis-angle).
  use_relative_mode: false
joints:
  slider:
    - name: linear_slider__joint1
      type: prismatic
      lower_m: 0.0
      upper_m: 0.80
      stiffness: 1.0e5
      damping: 1.0e3
  arm:
    - name: ur5e__shoulder_pan_joint
      type: revolute
      lower_rad: -6.28318530718
      upper_rad: 6.28318530718
      effort_limit: 150.0
    - name: ur5e__shoulder_lift_joint
      type: revolute
      lower_rad: -6.28318530718
      upper_rad: 6.28318530718
      effort_limit: 150.0
    - name: ur5e__elbow_joint
      type: revolute
      lower_rad: -3.14159265359
      upper_rad: 3.14159265359
      effort_limit: 150.0
    - name: ur5e__wrist_1_joint
      type: revolute
      lower_rad: -6.28318530718
      upper_rad: 6.28318530718
      effort_limit: 28.0
    - name: ur5e__wrist_2_joint
      type: revolute
      lower_rad: -6.28318530718
      upper_rad: 6.28318530718
      effort_limit: 28.0
    - name: ur5e__wrist_3_joint
      type: revolute
      lower_rad: -6.28318530718
      upper_rad: 6.28318530718
      effort_limit: 28.0
actuators:
  arm:
    joint_names_expr: ["ur5e__.*"]
    stiffness: 800.0
    damping: 40.0
  # Not spawned in v1. Kept as a record of the hardware slider.
  slider:
    joint_names_expr: ["linear_slider__joint1"]
    stiffness: 1.0e5
    damping: 1.0e3
    spawned: false
cutter:
  # Versioned legacy proxies in the cutter-link frame, from pybullet-tree-sim
  # assets (BSD-3-Clause, 4d9f838). The selected legacy URDF references the
  # mouth mesh, not a failure-zone runtime link. These are not validated current
  # BDS mock-pruner CAD. PCA OBBs are in cutter_boxes_fitted.json.
  mouth_half_extents_m: [0.007652, 0.027309, 0.024962]
  mouth_offset_m: [0.000693, 0.014691, 0.024962]
  failure_half_extents_m: [0.007000, 0.080000, 0.030000]
  failure_offset_m: [0.000447, 0.014543, 0.012502]
  source: stl_aabb_pybullet_tree_sim_4d9f838
  perpendicularity_tolerance_deg: 15.0
  report_as_sweep: true
