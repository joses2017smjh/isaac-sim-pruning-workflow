name: pruning_variants_v1
description: One env, one reward, four observations, five seeds.
seeds: [0, 1, 2, 3, 4]
num_envs_raycast: 1024
num_envs_tiled_rgb: 128
episode_length_s: 60.0
sim_dt: 0.008333333333333333
decimation: 2
control_hz: 60
slider_held_fixed: true
da2_in_ppo_loop: false
variants:
  A_flow:
    observation: flow
    grid: [8, 8]
    notes: >
      ICRA 2025 reproduction. Width is 2*H*W on the ToF grid and stays a different
      last-dim than B/C. Do not pad A to match.
  B_tof:
    observation: tof
    grid: [8, 8]
    notes: Real mock-pruner sensing. Width-matched with C and D.
  C_metric:
    observation: metric_student
    grid: [8, 8]
    native_grid: [256, 256]
    notes: >
      Default table is 8×8 vs ToF (content, not width). Native 256×256 is a second
      table for the performance ceiling, not the causal comparison.
  D_fused:
    observation: fused
    grid: [8, 8]
    notes: Inverse-variance ToF + metric fusion. Same width as C; contents must differ.
baselines:
  - scripted_tof
  - curobo_oracle
hard_gate: do not report a learned policy without both baselines
