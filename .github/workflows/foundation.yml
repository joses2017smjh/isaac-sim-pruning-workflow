name: Foundation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install foundation extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "source/isaaclab_pruning[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          ruff check source/isaaclab_pruning tests tools
          ruff format --check source/isaaclab_pruning tests tools
      - name: Test without Isaac Sim
        run: python -m pytest -q -m "not isaacsim_ci"
